name: bootstrap

# Thin caller. Run once, by hand, from the Actions tab after this lands on the
# default branch: it creates the labels and reports the exact check names to
# put in the branch protection rule.
#
# Re-run it after picking up a factory release that adds one. It is idempotent,
# and a label the roles and /dispatch match on but the repository does not have
# is a mechanism that fails silently.
#
# workflow_dispatch only. Nothing about this should happen automatically.
#
# Pinned to a release, like the other callers. See ci.yml for why.

on:
  workflow_dispatch:

jobs:
  bootstrap:
    # Exactly what the reusable workflow asks for. Declared here because a new
    # repository's default token is read-only, and a called workflow asking for
    # more than its caller holds never starts.
    permissions:
      contents: read
      issues: write
      checks: read
    uses: __FACTORY_REPO__/.github/workflows/bootstrap.yml@__FACTORY_VERSION__
