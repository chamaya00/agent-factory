name: agent-run

# Thin caller. One agent at a time, queued at the repo level by the factory
# workflow, capped in turns and minutes.
#
# Pinned to a release, like the other callers. See ci.yml for why.
#
# Requires the repository secret CLAUDE_CODE_OAUTH_TOKEN. The App id and key
# are optional but strongly preferred: without them, pull requests land in an
# approval-required state and every one has to be approved by hand.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue-number:
        description: Issue to work.
        required: true
        type: string

jobs:
  agent:
    uses: chamaya00/agent-factory/.github/workflows/agent-run.yml@__FACTORY_VERSION__
    with:
      issue-number: ${{ inputs.issue-number || '' }}
      max-turns: 40
      timeout-minutes: 30
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      app-id: ${{ secrets.AGENT_APP_ID }}
      app-private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
