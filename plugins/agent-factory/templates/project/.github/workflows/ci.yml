name: ci

# Thin caller: the logic lives in the factory, at the release pinned below.
#
# The pin is the point. This repository keeps running that exact release until
# somebody bumps the line and merges it - a new release in the factory changes
# nothing here on its own. `/update-agents` proposes the bump as a pull
# request, so the diff gets read here before it runs here.
#
# ---------------------------------------------------------------------------
# This ships as a placeholder gate, and it is meant to be replaced.
#
# A project gets its gate before it gets its stack. The reusable workflow's
# Node path fails a named script that is not there rather than skipping it,
# which is correct and which would make every pull request here red from the
# provisioning one onward, before a line of product code exists. So the
# commands path below checks the only thing that is true on day one: that the
# scaffolding a session and an agent run both read is intact.
#
# The last line is a tripwire, and it is the part that matters. The moment a
# file appears that provisioning did not put here, product code has landed and
# this gate does not test it - so the gate fails and says so, rather than going
# green on work nothing checked. A gate that silently skips is not a gate, and
# the failure mode this exists to stop is a placeholder nobody remembered to
# replace, passing every pull request on its way to a release.
#
# ---------------------------------------------------------------------------
# Replacing it
#
# `check-name` stays `checks` through the swap, and that is deliberate. The job
# name is the string branch protection matches on, so a gate that renames
# itself when it grows up forces the protection rule to be re-pointed in the
# same sitting - and until somebody does, the required check no longer reports
# and every merge is blocked, including the pull request that would fix it.
# Keeping one stable name means protection is set once, when the repository is
# provisioned, and is never touched again. What the gate actually runs is in
# the run summary, where it can change as often as it likes.
#
# So the swap is only ever about what runs. For a Node project, delete
# `commands` and restore:
#
#     with:
#       check-name: 'checks'
#       node-version: '20'
#       checks: 'typecheck,lint,test,build'
#
# Provisioning onto a repository that already has those four scripts starts on
# the Node path and skips all of this.
#
# If the project has no package manager - a static site, a Python or Go or Rust
# repository, a shell tool - then the commands path is the destination rather
# than a waypoint. Keep `commands` and replace the scaffolding checks in it
# with the project's real ones.
#
# Where to make the swap: on the engineer pull request that trips the tripwire,
# not on the default branch. On the Node path the first step is to find a
# lockfile, and the lockfile is in that pull request rather than on the default
# branch yet - so making the change on the default branch fails on a repository
# that is otherwise fine. Pushed onto the pull request branch, the new
# commands run against the code that needs them and the default branch stays
# green from the first commit. An agent may not edit this file, so a human
# makes the change either way.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: chamaya00/agent-factory/.github/workflows/ci.yml@__FACTORY_VERSION__
    with:
      check-name: 'checks'
      commands: |
        test -f CLAUDE.md
        test -f .claude/agent-factory.json
        test -d .claude/agents && test -d .claude/skills && test -d .claude/commands
        test -d docs/research && test -d docs/design && test -d docs/decisions
        unexpected="$(git ls-files | grep -Ev '^(README\.md|CLAUDE\.md|\.github/|\.claude/|docs/)' || true)"; if [ -n "$unexpected" ]; then echo "::error::Product code has landed and this placeholder gate does not test it: $unexpected. Replace the commands below with the project's real checks - see the comment at the top of this file. Branch protection does not need re-pointing; the check name does not change."; exit 1; fi
