name: release

# Cuts a release tag on the factory. Runs here, by hand, and nothing else
# triggers it.
#
# Release tags never move. A project pins a caller to one, and that pin is a
# decision its author made when they read the diff - so the commit behind it
# has to keep being the commit they reviewed. Nothing this workflow does
# changes what any existing project runs. A project picks up a release when
# somebody bumps the pin there and merges it, and not before.
#
# The tag name is not typed here, it is read from the plugin manifest. That is
# deliberate: the manifest version is also what decides whether an installed
# plugin updates, so a tag that disagreed with it would install as the version
# already cached and the update would silently do nothing. Cutting a release
# therefore starts with a pull request bumping that version.
#
# What this refuses:
#
# - A tag that already exists. Releases are immutable; there is no --force here.
# - A name that is not vMAJOR.MINOR.PATCH. This is not a general ref writer.
# - A name that disagrees with the plugin manifest.
# - Any commit that is not the tip of the default branch, so a feature branch
#   picked from the Run workflow dropdown does not get tagged.
# - Anything at all until the same checks that gate a pull request pass on it.
#
# It does not hand an agent a way to move the gates. It is dispatch-only, so it
# takes someone with write access here to start it, and no workflow in this
# repository grants `actions: write`, which is what an agent would need.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Tag to cut, for example v1.2.0. Leave empty to use the version in
          the plugin manifest, which is the normal case. Typing one only
          confirms what the manifest already says; it cannot override it.
        type: string
        default: ''

permissions:
  contents: read

# Two of these racing would both try to create the same ref.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: cut a release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The default branch, deliberately, rather than the ref this was
      # dispatched from. Editing this file on a branch and running it from
      # there still tags merged history and nothing else.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the guard's dependency
        run: python -m pip install --quiet pyyaml

      - name: Resolve the tag
        id: target
        env:
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          manifest="plugins/agent-factory/.claude-plugin/plugin.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::$manifest is missing. The plugin version is what names the tag."
            exit 1
          fi

          declared="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("version") or "")' "$manifest")"
          if [ -z "$declared" ]; then
            echo "::error::$manifest declares no version. Add one and merge it before cutting a release."
            exit 1
          fi

          tag="${VERSION:-v$declared}"

          if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$tag' is not a release version. Expected vMAJOR.MINOR.PATCH, for example v1.2.0."
            exit 1
          fi

          # The manifest is the single source. A tag that disagreed with it
          # would ship files the plugin then refuses to install, because an
          # unchanged version reads as "already up to date".
          if [ "$tag" != "v$declared" ]; then
            echo "::error::$tag disagrees with $manifest, which declares $declared. Bump the version there in a pull request and merge it first."
            exit 1
          fi

          # Immutable. This is the whole difference between this and a pointer.
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists and release tags never move - a project pinned to it has to keep resolving the commit its author reviewed. Bump the version in $manifest and cut the next one."
            exit 1
          fi

          target="$(git rev-parse HEAD)"

          echo "Tag:    $tag (new)"
          echo "Commit: $target on $DEFAULT_BRANCH"

          {
            echo "tag=$tag"
            echo "target=$target"
          } >> "$GITHUB_OUTPUT"

      - name: The gate passes on that commit
        run: |
          set -euo pipefail
          python scripts/validate_plugin.py
          python scripts/validate_workflows.py
          python scripts/test_ci.py
          python scripts/test_preflight.py
          python scripts/test_release.py

      - name: Cut the tag
        env:
          TAG: ${{ steps.target.outputs.tag }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -euo pipefail
          git tag "$TAG" "$TARGET"
          git push origin "refs/tags/$TAG"

      - name: Report what is available to pin
        if: always() && steps.target.outputs.tag != ''
        env:
          TAG: ${{ steps.target.outputs.tag }}
          TARGET: ${{ steps.target.outputs.target }}
          STATUS: ${{ job.status }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          {
            if [ "$STATUS" != "success" ]; then
              echo "## \`$TAG\` was not cut"
              echo
              echo "Nothing changed anywhere. Read the failing step above."
            else
              echo "## \`$TAG\` is available"
              echo
              echo "Pointing at \`${TARGET:0:7}\`, permanently."
              echo
              echo "**No project has picked this up.** Nothing running anywhere changed."
              echo "A project moves when somebody bumps its pin and merges that."
              echo
              echo "### To take it into a project"
              echo
              echo "Run \`/update-agents\` there. It bumps the four callers and"
              echo "refreshes the vendored roles in one pull request, so the diff"
              echo "shows what changes before anything runs."
              echo
              echo "### Workflows callable at \`$TAG\`"
              echo
              echo "A caller addressing one that is not listed here fails with an invalid"
              echo "workflow reference, in the project repo, naming nothing about this tag."
              echo
              git ls-tree --name-only "$TARGET" .github/workflows/ \
                | sed 's|.*/||; s|^|- \`|; s|$|\`|'
              echo
              echo "[Tree at \`$TAG\`]($REPO_URL/tree/$TAG)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
