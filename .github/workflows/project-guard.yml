name: project-guard

# The containment check, run inside each project rather than in the factory.
#
# Three things it enforces, all of which an agent would otherwise be able to
# undo quietly: memory files stay inside their cap, nothing that gates the repo
# gets edited by whoever the gates apply to, and a change to what the
# automation may do arrives declared rather than buried in a diff.
#
# Projects call it with:
#   jobs:
#     guard:
#       uses: chamaya00/agent-factory/.github/workflows/project-guard.yml@v1

on:
  workflow_call:
    inputs:
      memory-line-cap:
        description: >-
          Line cap for each `docs/memory/<role>.md`. Past the cap the retro
          rewrites the file rather than appending to it, which is the point of
          the cap rather than a side effect of it.
        type: number
        default: 40
      protected-paths:
        description: Newline-separated globs only a human may change.
        type: string
        default: |
          .github/workflows/*
          .github/workflows/**
          CODEOWNERS
          .github/CODEOWNERS
          .claude/agents/*
          .claude/agents/**
          .claude/skills/*
          .claude/skills/**
          .claude/commands/*
          .claude/commands/**
          .claude/agent-factory.json
      maintainers:
        description: >-
          Comma-separated logins allowed to change the protected paths. Empty
          means the repository owner alone.
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: memory cap and protected paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Memory files stay inside the cap
        env:
          CAP: ${{ inputs.memory-line-cap }}
        run: |
          set -euo pipefail
          failed=0
          shopt -s nullglob

          # Both paths, and that is not belt and braces. Memory moved from
          # `.claude/memory/` to `docs/memory/` because a run cannot write a
          # file under `.claude/` at all - the classification that refuses it is
          # checked before any permission rule, so no allowlist lifts it - and a
          # repository provisioned before the move still has its lessons at the
          # old path until `/update-agents` moves them. Capping only the new
          # path would silently stop capping every repository that has not
          # migrated yet, which is the shape of failure this whole file is
          # against: a check that still reports and no longer checks anything.
          for file in docs/memory/*.md .claude/memory/*.md; do
            lines="$(grep -cve '^[[:space:]]*$' "$file" || true)"
            if [ "$lines" -gt "$CAP" ]; then
              echo "::error file=$file::$lines lines, cap is $CAP. The retro rewrites past the cap - merge or drop entries to make room, do not append."
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] && echo "Memory files are inside the cap."

          # Said once, loudly, and never failed on: the lessons are readable
          # where they are and the roles read the new path, so an unmigrated
          # repository is degraded rather than broken, and failing every merge
          # over a move nobody here agreed to is worse than saying so.
          if compgen -G '.claude/memory/*.md' >/dev/null; then
            echo "::warning::Memory is still at .claude/memory/. The roles in this release read docs/memory/, so nothing is reading these lessons. Run /update-agents, which moves them."
          fi

          exit "$failed"

      - name: The managed block in CLAUDE.md is intact
        run: |
          set -euo pipefail

          # The block is how shared process prose reaches this repository:
          # /update-agents replaces everything between the markers and leaves
          # the rest of CLAUDE.md alone. A half-present pair is the dangerous
          # state - the command cannot tell where the block was meant to start,
          # and a wrong guess deletes prose somebody wrote about their own
          # repository while looking like a successful update.
          #
          # Absent entirely is fine and must stay fine: a repository provisioned
          # before the markers existed has not migrated yet, and failing it here
          # would block every merge over a chore it never agreed to.

          [ -f CLAUDE.md ] || { echo "No CLAUDE.md; nothing to check."; exit 0; }

          begins="$(grep -c '^<!-- agent-factory:begin -->$' CLAUDE.md || true)"
          ends="$(grep -c '^<!-- agent-factory:end -->$' CLAUDE.md || true)"

          if [ "$begins" -eq 0 ] && [ "$ends" -eq 0 ]; then
            echo "CLAUDE.md carries no managed block. Not migrated yet - /update-agents inserts it."
            exit 0
          fi

          if [ "$begins" -ne 1 ] || [ "$ends" -ne 1 ]; then
            echo "::error file=CLAUDE.md::Found $begins agent-factory:begin and $ends agent-factory:end marker(s); each must appear exactly once. /update-agents refuses to replace a block it cannot locate, so shared process prose silently stops reaching this repository."
            exit 1
          fi

          begin_line="$(grep -n '^<!-- agent-factory:begin -->$' CLAUDE.md | cut -d: -f1)"
          end_line="$(grep -n '^<!-- agent-factory:end -->$' CLAUDE.md | cut -d: -f1)"
          if [ "$begin_line" -ge "$end_line" ]; then
            echo "::error file=CLAUDE.md::agent-factory:end is at line $end_line, before or at begin on line $begin_line. The block has no contents and /update-agents cannot replace it."
            exit 1
          fi

          echo "CLAUDE.md's managed block is intact (lines $begin_line-$end_line)."

      - name: Nothing that gates this repo was edited
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SENDER: ${{ github.event.sender.login }}
          MAINTAINERS: ${{ inputs.maintainers || github.repository_owner }}
          PROTECTED: ${{ inputs.protected-paths }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          case ",$MAINTAINERS," in
            *",$AUTHOR,"*)
              echo "$AUTHOR is a maintainer. Nothing to check."
              exit 0
              ;;
          esac

          # A human pushing a gate fix onto an agent's branch is the ordinary
          # way a broken gate gets repaired, and binding this check to the
          # login that opened the pull request refuses exactly that - which
          # leaves landing the fix on the default branch as the only way
          # through, and a push to the default branch does not run this check
          # at all. Refusing the reviewable path and permitting the
          # unreviewable one is the opposite of the intent.
          #
          # So also ask who pushed the commits that triggered this run.
          # `sender` is GitHub's own account for the event, not metadata
          # carried inside the commit: a `synchronize` names whoever pushed.
          # That distinction is the whole reason it is used here. Commit
          # author and committer are both set by whoever runs `git`, so an
          # agent asked not to edit gates could simply commit as the owner
          # and be believed - a bypass written into the check itself. There
          # is no equivalent way to forge being the sender of a push.
          #
          # The narrowness is deliberate. This says "a maintainer pushed what
          # is being checked right now", not "a maintainer is involved
          # somewhere in this branch's history". A later push by the agent
          # makes it fire again while the protected change is still in the
          # diff, which reads as noise until it is the run that matters.
          # Both halves have to be non-empty before the comparison is worth
          # making. An empty sender against an empty maintainer list matches
          # ",," and passes, which is a bypass hiding in a string test rather
          # than in any decision anybody made.
          if [ -n "${SENDER:-}" ] && [ -n "${MAINTAINERS:-}" ]; then
            case ",$MAINTAINERS," in
              *",$SENDER,"*)
                echo "$SENDER pushed this, and is a maintainer. Nothing to check."
                exit 0
                ;;
            esac
          fi

          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          failed=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue

            hit=0
            while IFS= read -r pattern; do
              [ -z "$pattern" ] && continue
              case "$file" in
                $pattern) hit=1 ;;
              esac
            done <<< "$PROTECTED"
            [ "$hit" -eq 0 ] && continue

            echo "::error file=$file::$AUTHOR may not change this. A system that can rewrite its own gates has no gates. If this change is a maintainer's, push it to this branch from their own account - the last push to a pull request is what this reads, so it clears on that push rather than needing the fix moved to the default branch."
            failed=1
          done <<< "$changed"
          [ "$failed" -eq 0 ] && echo "No protected path was touched by the automation."
          exit "$failed"

      - name: A change to privilege is declared, not slipped in
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The body is read live, and that is the difference between this
          # check being fixable and not.
          #
          # A re-run replays the event that started the run, so
          # github.event.pull_request.body is the body as it was when the pull
          # request opened. An author whose declaration this step rejected then
          # corrects the body, re-runs the job, and the job reads the old text
          # again - and no number of re-runs can ever read anything else. That
          # is not hypothetical: a declaration written wrapped in backticks did
          # not start its line, this step failed it correctly, and fixing the
          # body changed nothing twice in a row. The exits left were an empty
          # commit or a close and reopen, and the house rules forbid both by
          # name, for reasons that have nothing to do with this.
          #
          # The payload stays as a fallback so a failed read is never worse
          # than the old behaviour, and the log says which was used rather than
          # leaving somebody to wonder why a corrected body still failed.
          live="$(gh pr view "$PR_NUMBER" --json body --jq '.body' 2>/dev/null || true)"
          if [ -n "$live" ]; then
            BODY="$live"
            echo "Read the pull request body live, not from the event payload."
          else
            echo "::warning::Could not read the body from the API, so this used the event payload - which a re-run replays unchanged. If a corrected body keeps failing, that is why."
          fi

          # Deliberately no maintainer exemption, unlike the protected-paths
          # check above. That one asks who is editing a gate, and trusts the
          # owner with it. This one asks whether a diff quietly widens what the
          # automation can reach - and the case worth catching is precisely a
          # pull request merged on the owner's behalf under a standing "merge
          # when green", where nobody read the diff and the author is a
          # maintainer. An exemption here would exempt the only case it is for.

          # Documentation is excluded, and the reason is that it cannot do
          # any of what this step looks for: prose describing a `permissions:`
          # block does not grant one. Left in, it fires on the house-rules
          # skill that documents this very check - a false positive on every
          # repository that carries it, which is all of them. A check that is
          # routinely red is one people stop reading, and that costs more than
          # the narrowing does. Nothing executable is excluded.
          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -vE '\.(md|markdown|txt)$' || true)"
          if [ -z "$files" ]; then
            echo "Only documentation changed. Nothing here can widen anything."
            exit 0
          fi

          added="$(git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- $files \
            | grep -E '^\+' | grep -vE '^\+\+\+' || true)"

          scopes='actions|attestations|checks|contents|deployments|discussions'
          scopes="$scopes|id-token|issues|models|packages|pages|pull-requests"
          scopes="$scopes|repository-projects|security-events|statuses"

          found=""
          report() {
            hits="$(printf '%s\n' "$added" | grep -E "$2" || true)"
            [ -z "$hits" ] && return 0
            found="yes"
            echo "$1"
            printf '%s\n' "$hits" | sed 's/^/    /' | head -10
          }

          report "Token permissions" \
            "permissions:|^\+[[:space:]]*($scopes):[[:space:]]*write"
          report "A secret" "secrets[.:]"
          report "A trigger that runs against code from a fork" \
            "pull_request_target|workflow_run"
          report "An action this repository will execute" "uses:[[:space:]]*[^[:space:]]"

          # The two above are YAML-shaped and miss the settings file entirely.
          # `permissions:` does not match `"permissions":` - the quote sits
          # between the word and the colon - so a JSON settings file could grant
          # what a workflow could not, through the same check, silently.
          #
          # This matters because the factory ships `.claude/settings.json`. That
          # makes it a route by which one release could widen what automation may
          # do in every project at once, and this step is the only thing that
          # reads a project's diff before it merges.
          report "Permissions in a settings file" \
            '"permissions"[[:space:]]*:'
          # A hook is arbitrary code this repository starts executing on its own,
          # without anybody invoking it. Adding one is not forbidden - the
          # factory ships exactly one - but it is not something to discover
          # afterwards either.
          report "A hook this repository will execute on its own" \
            '"(SessionStart|SessionEnd|UserPromptSubmit|PreToolUse|PostToolUse|Stop|SubagentStop|Notification|PreCompact)"[[:space:]]*:'

          if [ -z "$found" ]; then
            echo "Nothing in this diff changes what the automation may do."
            exit 0
          fi

          # Accept the shapes a person or an agent actually writes: a plain
          # line, a markdown heading, a bolded lead-in. Demanding a bare line
          # start rejects `## Privilege change: ...`, which reads as a correct
          # declaration to every reader except this regex. What is still
          # required is that the declaration opens its own line and says
          # something after the colon, so prose mentioning the phrase in
          # passing still does not pass.
          if printf '%s' "$BODY" | grep -qE '^[[:space:]]*#{0,6}[[:space:]]*\**[[:space:]]*Privilege change:[[:space:]]*[^[:space:]]'; then
            echo
            echo "Declared in the pull request body. A person still has to agree with it."
            exit 0
          fi

          echo
          echo "::error::This diff changes what the automation may do, and the pull request does not say so. Reverting a merge does not take back a permission that ran, a secret that was read, or an action that executed. Add a line to the body starting 'Privilege change:' saying what widened and why, so the person merging is deciding rather than discovering. The check does not forbid the change - it forbids doing it silently."
          exit 1
