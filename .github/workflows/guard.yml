name: guard

# Runs on the factory itself. Two jobs: the manifests still parse, and the
# plugin still describes how we work rather than what any one project contains.
# This is the check that keeps the toolbox portable a year from now.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate plugin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install workflow linting dependency
        run: python -m pip install --quiet pyyaml

      - name: Manifests, roles, skills, portability
        run: python scripts/validate_plugin.py

      - name: Workflows parse as YAML
        run: python scripts/validate_workflows.py
