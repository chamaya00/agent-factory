name: guard

# Runs on the factory itself, one script per step, and each step's name says
# what it proves. Between them: the manifests still parse, the plugin still
# describes how we work rather than what any one project contains, prose still
# agrees with what each role is granted, and the shell this factory ships still
# does what it claims - the gate still fails what it is supposed to fail,
# project-guard still stops a privilege change arriving undeclared and a gate
# edit arriving from an agent branch, provisioning still refuses what it should,
# and release still refuses a tag that would move or disagree with the manifest.
#
# The second of those is what keeps the toolbox portable a year from now. The
# shell is where a bug is expensive, which is why the scripts that cover it
# execute it rather than read it: the gate can let a bad pull request merge in
# every project, project-guard can let a widened permission through a merge
# nobody read, provisioning holds an admin token, and release changes what
# every project runs.
#
# No count of the steps is kept here. This comment once said six while the job
# ran eight, and validate_plugin.py already fails the build if a script in
# scripts/ has no step below.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate plugin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install workflow linting dependency
        run: python -m pip install --quiet pyyaml

      - name: Manifests, roles, skills, portability
        run: python scripts/validate_plugin.py

      - name: Workflows parse and stay inside their limits
        run: python scripts/validate_workflows.py

      - name: The gate fails the runs it is supposed to fail
        run: python scripts/test_ci.py

      - name: A privilege change cannot arrive undeclared
        run: python scripts/test_project_guard.py

      # Reads English rather than structure, so it is the one check here that
      # can be wrong in both directions. Pinned in both.
      - name: Prose still agrees with what each role is granted
        run: python scripts/test_capability_claims.py

      - name: Release resolves the right commit for a major tag
        run: python scripts/test_release.py

      # The one workflow here that holds an admin token for every repository
      # the person owns. What it refuses is the whole of its safety.
      - name: Provision refuses what it should refuse
        run: python scripts/test_provision.py
