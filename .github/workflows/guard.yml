name: guard

# Runs on the factory itself. Three things: the manifests still parse, the
# plugin still describes how we work rather than what any one project contains,
# and the agent-run preflight still refuses the runs it is supposed to refuse.
#
# The middle one is what keeps the toolbox portable a year from now. The last
# one is the only place a bug here costs subscription quota.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate plugin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install workflow linting dependency
        run: python -m pip install --quiet pyyaml

      - name: Manifests, roles, skills, portability
        run: python scripts/validate_plugin.py

      - name: Workflows parse and stay inside their limits
        run: python scripts/validate_workflows.py

      - name: Agent-run preflight makes the right decisions
        run: python scripts/test_preflight.py
