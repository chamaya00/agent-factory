name: agent-run

# Wraps anthropics/claude-code-action for one agent run on one issue.
#
# Every setting below exists because a Pro subscription is a fixed budget:
# one run at a time, queued rather than cancelled, hard-capped in turns and
# minutes, and refused outright once an issue has burned three attempts.
#
# Projects call it with:
#   jobs:
#     agent:
#       uses: chamaya00/agent-factory/.github/workflows/agent-run.yml@v1
#       secrets: inherit

on:
  workflow_call:
    inputs:
      issue-number:
        description: Issue to work. Only needed for workflow_dispatch; otherwise taken from the event.
        type: string
        default: ''
      max-turns:
        description: >-
          Hard cap on agentic turns for one run. 15 was below the floor: an
          orchestrator spends most of a decomposition reading the roles, the
          skills, the memory file and the issue before it writes anything, and
          the action fails the whole run when the cap is hit even if the work
          itself finished. Because that failure is terminal, the number is
          stated to the agent in the prompt - a budget it cannot see is one it
          cannot spend deliberately - and the hand-back step names it on the
          issue when a run dies on it, so the next reader can tell a cap from a
          scoping problem without opening the job log.

          Raised from 40 after three engineer runs on the same repository
          finished materially complete at 45, 48 and 57 turns - every one of
          them past the cap, and one of them twice in a row on the same issue.
          40 was below the floor for a role that has to build a site and run
          its fixtures, exactly as 15 was below the floor before it. This is a
          spend cap and nothing else: it stops a runaway run, and a run that
          reaches it has not been judged, only stopped.
        type: number
        default: 80
      timeout-minutes:
        description: Wall-clock cap for the agent job.
        type: number
        default: 30
      model:
        description: Model for the run. Empty uses the action default.
        type: string
        default: ''
      max-attempts:
        description: >-
          Attempts allowed on one issue before the run is refused. Three
          attempts means the issue was scoped wrong, not that it needs a fourth.
          Counted as runs, not failures: one marker comment goes up when a run
          starts, so a run that then refuses - an unmerged dependency, a command
          it needs denied - has spent an attempt too. Deliberate. The cost is a
          slice of the subscription either way, and the alternative is deciding
          after the fact which runs "really" counted.

          Revisited after a run pushed a complete branch, opened no pull
          request, and spent an attempt anyway - which looked like the rule
          punishing work that had actually been done. Left as it is. The
          engineer now opens its pull request as a draft before it starts, so
          a run that dies late leaves something reviewable rather than nothing,
          and the case that made this look unfair is mostly gone. Exempting
          "runs that delivered something" would make the count arguable, and a
          rule you can argue with is not a rule.
        type: number
        default: 3
      max-supervisions:
        description: >-
          Runs allowed on one objective before the orchestrator is refused.
          Separate from max-attempts, and deliberately much larger, because the
          two count different things. A run on a child is an attempt at that
          work, and three means the scoping was wrong. A run on an objective is
          the orchestrator supervising - it is woken every time a child reaches
          agent:review or agent:blocked, so a healthy four-child objective
          spends a dozen of these and none of that is evidence of anything.
          Counted the same way, by marker comment. It is a stop on a loop, not
          a judgement: hitting it means something is waking the orchestrator
          more often than the work justifies, which is worth reading before
          raising the number.
        type: number
        default: 20
      run-label:
        description: Label on an issue that means "run the agent now".
        type: string
        default: 'agent:queued'
      trigger-phrase:
        description: Phrase in a comment that starts a run.
        type: string
        default: '@claude'
      skip-path-patterns:
        description: >-
          Newline-separated globs. When a run is attached to a pull request and
          every changed file matches one of these, the run is skipped. Docs and
          lockfiles are not worth a slice of the subscription.
        type: string
        default: |
          docs/**
          *.md
          **/*.md
          package-lock.json
          **/package-lock.json
          pnpm-lock.yaml
          **/pnpm-lock.yaml
          yarn.lock
          **/yarn.lock
          LICENSE
    secrets:
      claude-code-oauth-token:
        description: OAuth token from `claude setup-token`. Bills the subscription rather than API credits.
        required: true
      app-id:
        description: GitHub App ID for the agent identity. Optional but strongly preferred.
        required: false
      app-private-key:
        description: Private key for that App.
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  # Never actions: write. A system that can rewrite its own gates has no gates.

jobs:
  # Nothing ever noticed that nothing was happening, and that is how every
  # fault in this system has presented.
  #
  # Five separate bugs - a cancelled pending run, an unresolvable parent, a
  # refused bot actor, an invisible merge, a run that pushed but opened no pull
  # request - produced one identical symptom: an issue correctly labelled
  # `agent:queued`, nothing running against it, and nothing in any log saying
  # so. Every one was found by a human noticing an absence, which does not
  # scale and is the burden the orchestrator exists to remove.
  #
  # This job says so out loud. It does NOT re-queue anything, deliberately.
  # Re-queueing would be a second path into the place where a bug spends the
  # subscription, and a watchdog that is wrong spends it repeatedly. A comment
  # costs nothing and turns silence into a signal a human or an orchestrator
  # can act on - which was the actual complaint, since in every case above the
  # state was recoverable the moment anybody looked.
  #
  # It stays quiet after saying it once: it speaks only when the newest marker
  # comment on the issue is not already its own. A run starting writes a marker,
  # which re-arms it.
  stale-queue:
    name: say when a queued issue is not running
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      APP_ID: ${{ secrets.app-id }}
    steps:
      - name: Mint the agent identity token
        id: app-token
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - name: Name the issues that are queued and idle
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_LABEL: ${{ inputs.run-label }}
          MARKER: '<!-- agent-factory:stalled -->'
        run: |
          # Best effort, like every other hand-back path here: a watchdog that
          # fails a run would be worse than the silence it is reporting.
          issues="$(gh issue list --label "$RUN_LABEL" --state open \
            --json number --jq '.[].number' 2>/dev/null || true)"
          if [ -z "$issues" ]; then
            echo "Nothing is queued."
            exit 0
          fi

          for n in $issues; do
            labels="$(gh issue view "$n" --json labels --jq '.labels[].name' 2>/dev/null || true)"
            # Running is not stalled, and an issue a human has stopped is not
            # this job's business.
            echo "$labels" | grep -qx 'agent:running' && { echo "#$n is running."; continue; }
            echo "$labels" | grep -qx 'agent:blocked' && continue
            echo "$labels" | grep -qx 'needs-decomposition' && continue

            # Say it once. The newest agent-factory marker tells us whether the
            # last thing to happen here was a run starting or this job speaking.
            last="$(gh issue view "$n" --json comments \
              --jq '[.comments[] | select(.body | contains("agent-factory:"))] | last | .body' \
              2>/dev/null || true)"
            case "$last" in
              *"agent-factory:stalled"*) echo "#$n already reported."; continue ;;
            esac

            echo "Reporting #$n as queued but idle."
            gh issue comment "$n" --body "$(printf '%s %s\n\n%s\n\n%s' \
              "$MARKER" "**Queued, but nothing is running it.**" \
              "This issue carries \`$RUN_LABEL\` and has no \`agent:running\`, so a run should have started and did not. Every fault this system has had looks exactly like this - a correctly labelled issue with nothing behind it - and the state is usually recoverable the moment somebody looks." \
              "Nothing has been re-queued automatically: that would be a second way to spend the subscription. Remove and re-add the label to start a run, or read the recent workflow runs if this repeats.")" || true
          done

  # A merge is the other half of the loop, and it used to be missing.
  #
  # The hand-back wakes an objective when a child's run ends, so the
  # orchestrator learns that a child finished. It cannot learn that the child's
  # work actually landed: the researcher and the designer push a branch and a
  # human merges it later, and a merge raises no issue event. So an objective
  # would report "waiting on #40 to merge", the human would merge, and nothing
  # would wake it - the orchestrator's own status comment promised it would
  # pick that up, and it could not.
  #
  # Observed on new-project-agents-v3#39: research merged at 18:04 and no run
  # started, because the last event this workflow could see was the child's own
  # run ending seven minutes earlier.
  #
  # This job closes that. It writes a label and nothing else - the objective's
  # own run is started by the label event that follows, through the ordinary
  # preflight, so a merge cannot skip any of the gating an issue normally gets.
  wake-on-merge:
    name: wake the objective a merge unblocks
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      APP_ID: ${{ secrets.app-id }}
    steps:
      - name: Mint the agent identity token
        id: app-token
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - name: Queue the parent objective
        env:
          # The App token, deliberately: a label written with github.token
          # raises no event, so the objective would be labelled and never run.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_LABEL: ${{ inputs.run-label }}
        run: |
          # Best effort throughout. A merge that wakes nothing degrades to what
          # happened before this job existed - a human queues the objective -
          # so nothing here is allowed to fail the run.
          children="$(gh pr view "$PR" --json closingIssuesReferences \
            --jq '.closingIssuesReferences[].number' 2>/dev/null || true)"
          if [ -z "$children" ]; then
            echo "#$PR closes no issue. Nothing to wake."
            exit 0
          fi

          for child in $children; do
            # The same body line the hand-back reads. A run cannot create a
            # native sub-issue link, so this is the link that exists.
            parent="$(gh issue view "$child" --json parent --jq '.parent.number' 2>/dev/null || true)"
            if [ -z "$parent" ] || [ "$parent" = "null" ]; then
              parent="$(gh issue view "$child" --json body --jq '.body' 2>/dev/null \
                | head -5 \
                | grep -oiE '^parent:[[:space:]]*#[0-9]+' \
                | grep -oE '[0-9]+' \
                | head -1 || true)"
            fi
            if [ -z "$parent" ] || [ "$parent" = "null" ]; then
              echo "#$child has no parent objective. Nothing to wake for it."
              continue
            fi

            plabels="$(gh issue view "$parent" --json labels --jq '.labels[].name' 2>/dev/null || true)"
            has() { echo "$plabels" | grep -qx "$1"; }
            has 'objective' || { echo "#$parent is not an objective. Leaving it alone."; continue; }
            if has 'agent:blocked' || has 'needs-decomposition'; then
              echo "#$parent is stopped for a human. Not waking it."
              continue
            fi
            if has "$RUN_LABEL" || has 'agent:running'; then
              echo "#$parent is already queued or running."
              continue
            fi

            echo "#$child merged. Waking the orchestrator on #$parent."
            gh issue edit "$parent" --add-label "$RUN_LABEL" || true
          done

  preflight:
    name: decide whether to run
    # A merge is handled above, and so is the schedule. Without this, either
    # would reach the preflight as something to work and spend a run on it.
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      # write, not read: a run refused on a pull request still has to label it
      # agent:blocked and say why, or a refusal reads as a flake.
      pull-requests: write
    outputs:
      should-run: ${{ steps.decide.outputs.should-run }}
      role: ${{ steps.decide.outputs.role }}
      issue: ${{ steps.decide.outputs.issue }}
      kind: ${{ steps.decide.outputs.kind }}
      attempt: ${{ steps.decide.outputs.attempt }}
      budget: ${{ steps.decide.outputs.budget }}
      marker: ${{ steps.decide.outputs.marker }}
    steps:
      - name: Resolve role, gate, and attempt count
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || inputs.issue-number }}
          KIND: ${{ (github.event.issue.pull_request != null || github.event.pull_request != null) && 'pr' || 'issue' }}
          RUN_LABEL: ${{ inputs.run-label }}
          TRIGGER_PHRASE: ${{ inputs.trigger-phrase }}
          MAX_ATTEMPTS: ${{ inputs.max-attempts }}
          MAX_SUPERVISIONS: ${{ inputs.max-supervisions }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          LABEL_NAME: ${{ github.event.label.name }}
          SKIP_PATTERNS: ${{ inputs.skip-path-patterns }}
          MARKER: '<!-- agent-factory:attempt -->'
          SUPERVISION_MARKER: '<!-- agent-factory:supervision -->'
        run: |
          set -euo pipefail

          skip() { echo "$1"; echo "should-run=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # gh splits issues and pull requests across two subcommands, and a
          # comment on a pull request arrives as an issue_comment event.
          view()    { gh "$KIND" view "$NUMBER" "$@"; }
          edit()    { gh "$KIND" edit "$NUMBER" "$@"; }
          comment() { gh "$KIND" comment "$NUMBER" "$@"; }

          [ -n "${NUMBER:-}" ] || skip "No issue or pull request in context. Nothing to run."

          # A comment only counts when it carries the trigger phrase.
          case "$EVENT_NAME" in
            issue_comment|pull_request_review_comment)
              case "$COMMENT_BODY" in
                *"$TRIGGER_PHRASE"*) : ;;
                *) skip "Comment does not carry $TRIGGER_PHRASE." ;;
              esac
              ;;
          esac

          # A label event only counts when it is the run label.
          if [ "$EVENT_NAME" = "issues" ] && [ "$EVENT_ACTION" = "labeled" ] && [ "$LABEL_NAME" != "$RUN_LABEL" ]; then
            skip "Label '$LABEL_NAME' is not the run label."
          fi

          labels="$(view --json labels --jq '.labels[].name' || true)"
          echo "Labels: $(echo "$labels" | tr '\n' ' ')"

          has_label() { echo "$labels" | grep -qx "$1"; }

          if has_label 'needs-decomposition'; then
            skip "Issue is labelled needs-decomposition. A human decides what happens next."
          fi
          if has_label 'agent:blocked'; then
            skip "Issue is labelled agent:blocked. Refusing to run."
          fi

          # An objective goes to the orchestrator. Everything else needs exactly
          # one role label.
          role=""
          if has_label 'objective'; then
            role="orchestrator"
          fi
          for candidate in researcher designer engineer; do
            if has_label "role:$candidate"; then
              if [ -n "$role" ]; then
                edit --add-label 'agent:blocked' || true
                skip "Carries more than one role. Work needing two roles is two issues."
              fi
              role="$candidate"
            fi
          done
          [ -n "$role" ] || skip "No role label and not an objective."

          # Docs and lockfiles are not worth a slice of the subscription.
          if [ "$KIND" = "pr" ]; then
            ignored() {
              local file="$1" pattern
              while IFS= read -r pattern; do
                [ -z "$pattern" ] && continue
                case "$file" in $pattern) return 0 ;; esac
                # A `**/x` pattern has to match `x` at the root as well.
                case "$pattern" in
                  '**/'*) case "$file" in ${pattern#'**/'}) return 0 ;; esac ;;
                esac
              done <<< "$SKIP_PATTERNS"
              return 1
            }
            changed="$(gh pr diff "$NUMBER" --name-only || true)"
            if [ -n "$changed" ]; then
              relevant=0
              while IFS= read -r file; do
                [ -z "$file" ] && continue
                if ! ignored "$file"; then
                  relevant=1
                  break
                fi
              done <<< "$changed"
              [ "$relevant" -eq 1 ] || skip "Pull request only touches ignored paths."
            fi
          fi

          # Run budget. Each run leaves exactly one marker comment, so the
          # markers are the count.
          #
          # Two budgets, counted with two markers, because they measure
          # different things. A run on a child is an attempt at that work, and
          # three of them means the issue was scoped wrong - the three-strike
          # rule, unchanged. A run on an objective is the orchestrator
          # supervising, and it is woken every time one of its children reaches
          # agent:review or agent:blocked. A four-child objective therefore
          # spends a dozen orchestrator runs before anything has gone wrong.
          # Counted against three, every objective with more than two children
          # would be refused halfway through the work it was still doing
          # correctly.
          if [ "$role" = "orchestrator" ]; then
            marker="$SUPERVISION_MARKER"
            budget="$MAX_SUPERVISIONS"
          else
            marker="$MARKER"
            budget="$MAX_ATTEMPTS"
          fi

          attempts="$(view --json comments --jq "[.comments[] | select(.body | contains(\"$marker\"))] | length" || echo 0)"
          if [ "$attempts" -ge "$budget" ]; then
            if [ "$role" = "orchestrator" ]; then
              reason="This objective has already had $attempts orchestrator runs, which is the supervision budget. That is a stop on a loop, not the three-strike rule: something is waking the orchestrator more often than the work justifies. Read this issue's history before raising \`max-supervisions\` - a child that keeps flipping between queued and blocked is the usual cause, and raising the number spends more of the subscription on it."
            else
              reason="Three attempts on one issue means the issue was scoped wrong, not that it needs a fourth. The count is of runs, not failures. Labelled \`agent:blocked\`. Decompose it or rewrite the acceptance criteria, then clear the label."
            fi
            edit --add-label 'agent:blocked' --remove-label "$RUN_LABEL" || true
            comment --body "$(printf '%s\n\n%s' \
              "$marker Refusing to run: this has already had $attempts agent runs." \
              "$reason")" || true
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            echo "::error::#$NUMBER has already had $attempts agent runs."
            exit 1
          fi

          echo "Running $role on #$NUMBER (attempt $((attempts + 1)))."
          {
            echo "should-run=true"
            echo "role=$role"
            echo "issue=$NUMBER"
            echo "kind=$KIND"
            echo "attempt=$((attempts + 1))"
            echo "budget=$budget"
            echo "marker=$marker"
          } >> "$GITHUB_OUTPUT"

  agent:
    name: run the agent
    needs: preflight
    if: needs.preflight.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Repo-wide, and deliberately not per-issue: two agents running at once on
    # a Pro plan exhausts it. Queue, never cancel - a cancelled run has already
    # spent its tokens and leaves the issue half finished.
    #
    # On this job rather than the whole workflow, and that is the whole point.
    # A concurrency group holds exactly one pending entry: when a third run
    # arrives, the one already waiting is cancelled. With the group on the
    # workflow, every event put the *preflight* in that queue - and preflight
    # is what decides an event is not worth running. So the agent's own
    # housekeeping (labelling an issue agent:running, posting its attempt
    # marker) raised events that queued behind the run that made them and
    # cancelled each other, and eventually cancelled something real.
    #
    # That is not hypothetical. In new-project-agents-v3, the orchestrator
    # queued its first child and the run for it was cancelled before its
    # preflight executed a single step, displaced by the hand-back step
    # labelling the parent agent:review. The child sat agent:queued with
    # nothing running it, silently, which is the worst shape this failure
    # could take.
    #
    # Here, preflight always runs. It costs about five seconds and no
    # subscription, refuses everything that is not a real run label or a real
    # trigger phrase, and only what survives it reaches this job and takes the
    # slot. The repo-wide one-at-a-time guarantee is unchanged.
    concurrency:
      group: agent-run-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      # The secrets context is not available in a step `if`, so the App id has
      # to come through env to decide whether there is an App identity at all.
      APP_ID: ${{ secrets.app-id }}
    steps:
      - name: Mint the agent identity token
        id: app-token
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Mark the issue running
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.preflight.outputs.issue }}
          KIND: ${{ needs.preflight.outputs.kind }}
          ATTEMPT: ${{ needs.preflight.outputs.attempt }}
          ROLE: ${{ needs.preflight.outputs.role }}
          BUDGET: ${{ needs.preflight.outputs.budget }}
          MARKER: ${{ needs.preflight.outputs.marker }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The marker decides which budget this run is counted against, so it
          # comes from preflight rather than being written twice.
          if [ "$ROLE" = "orchestrator" ]; then
            what="supervision run $ATTEMPT of $BUDGET"
          else
            what="attempt $ATTEMPT of $BUDGET"
          fi
          gh "$KIND" edit "$ISSUE" --add-label 'agent:running' --remove-label "${{ inputs.run-label }}" || true
          gh "$KIND" comment "$ISSUE" --body "$(printf '%s\n\n%s' \
            "$MARKER Starting **$ROLE**, $what." \
            "[Run log]($RUN_URL)")" || true

      # The roles live in this repository, under .claude/, put there by
      # /new-project and updated by /update-agents. The action loads them the
      # way an interactive session does, so there is nothing to fetch here.
      #
      # This is only a presence check, and it is worth the six lines: an agent
      # that starts with no roles does not fail, it improvises. That produces a
      # pull request that looks like work and follows none of the rules, which
      # is more expensive to deal with than a job that refused to start.
      - name: The roles are in the repository
        run: |
          set -euo pipefail
          # Guarded rather than piped through 2>/dev/null: under pipefail a
          # missing directory fails the assignment and the step dies before
          # printing the one line that says what to do about it.
          count=0
          if [ -d .claude/agents ]; then
            count=$(find .claude/agents -name '*.md' -type f | wc -l)
          fi
          if [ "$count" -eq 0 ]; then
            echo "::error::No role definitions in .claude/agents/. Run /update-agents in this repository to bring them in, then re-run. Starting without them means an agent that answers to none of the house rules."
            exit 1
          fi
          echo "$count role definition(s) found."

      # The action starts an agent with a read-only tool set: Read, Glob, Grep,
      # its own comment tool, and the git commands it uses to land a commit.
      # Not Write, not Edit, not Bash, and nothing that can write to GitHub.
      #
      # Every role in .claude/agents/ declares tools beyond that set, and a role
      # that cannot use the tools it declares does not fail cleanly - it
      # improvises, spends the run, and leaves the issue agent:blocked with a
      # comment explaining that it had no tools. That is the most expensive way
      # to discover a configuration problem, so the allowlist is explicit here
      # and the guard checks it against the role definitions.
      #
      # The role definitions name mcp__github__* tools. Those come from the
      # GitHub MCP server, which this action does not start, so the equivalent
      # capability is granted as scoped `gh` commands instead - the same CLI and
      # the same token the rest of this workflow already uses.
      #
      # Scoped, not `Bash(gh:*)`: `gh api`, `gh workflow`, `gh secret` and
      # `gh repo` stay out of reach. A system that can rewrite its own gates has
      # no gates, and `gh api` is a hole straight through them.
      - name: Resolve the tool allowlist for this role
        id: tools
        env:
          ROLE: ${{ needs.preflight.outputs.role }}
        run: |
          set -euo pipefail

          # Every role reads the repository and answers on its own issue.
          #
          # --allowedTools MERGES with the action's own set rather than
          # replacing it, confirmed in run 33792437707: the array it passed the
          # SDK was its defaults - Glob, Grep, LS, Read, its comment tool, the
          # CI tools, and Bash(git add|commit|git-push.sh|rm) - followed by
          # these. So nothing the action needs has to be repeated here.
          #
          # git status and git diff do have to be listed: they are not in that
          # default set, and a role verifies its own acceptance criteria with
          # them ("the diff touches only docs/" is checked, not asserted).
          common='Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*)'
          common="$common,Bash(git push:*),Bash(git status:*),Bash(git diff:*)"

          case "$ROLE" in
            orchestrator)
              # Creates and labels children, and decides which of them runs.
              # Writes no files, by definition.
              #
              # The pull request commands are read-only and all four are load
              # bearing: before queueing a child the orchestrator has to prove
              # the issues it depends on are merged to the default branch, not
              # merely labelled agent:review. A child queued on a dependency
              # that only looks done refuses, correctly, and spends one of its
              # three attempts doing it. No `gh pr merge` and no `gh pr create`:
              # this role decides what runs, not what lands.
              tools="$common,Bash(gh issue create:*),Bash(gh issue edit:*),Bash(gh label list:*),Bash(gh search issues:*)"
              tools="$tools,Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh pr checks:*)"
              ;;
            researcher)
              # The action lists WebSearch and WebFetch in its own
              # DISALLOWED_TOOLS. Naming them here wins: run 33792437707
              # reached the web and cited what it read. Without this the
              # researcher can only read the repository it is already in,
              # which is not research - and the failure is silent, because a
              # role with no web access still writes a confident Sources
              # section.
              tools="$common,Write,Edit,WebFetch,WebSearch"
              ;;
            designer)
              tools="$common,Write,Edit,WebFetch"
              ;;
            engineer)
              # Writes code, runs the checks the gate runs, and opens the
              # pull request. No `gh pr merge`: merging stays a human's call.
              tools="$common,Write,Edit"
              tools="$tools,Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr checks:*)"
              # `gh pr ready` is how a draft stops being a draft. Without it the
              # role can open the draft this workflow now asks it to open first,
              # and then cannot finish it.
              tools="$tools,Bash(gh pr ready:*),Bash(gh pr list:*)"
              tools="$tools,Bash(npm ci:*),Bash(npm install:*),Bash(npm run:*),Bash(npm test:*)"
              # npm was once the only runner here, and the gate it is meant to
              # mirror is not a Node gate: ci.yml has a commands path precisely
              # so it can be called from a Python, Go, or Rust repository. On a
              # project without a package.json the engineer therefore could not
              # execute its own tests - and that does not fail cleanly. It
              # verifies the acceptance criteria with inline greps instead,
              # reports them as checked, and a test script that cannot pass on
              # any tree ships looking green. That is the failure this list
              # exists to prevent, so the runners are granted per stack.
              #
              # Scoped per runner rather than Bash(bash:*), for the same reason
              # `gh` is scoped above: a role that can run any shell command can
              # rewrite the gates it is being checked by.
              tools="$tools,Bash(make:*),Bash(pytest:*),Bash(python -m pytest:*),Bash(python3 -m pytest:*)"
              tools="$tools,Bash(go test:*),Bash(cargo test:*)"
              #
              # `foo:*` is shorthand for `foo *`, and the space is part of the
              # rule. An entry whose prefix ends mid-argument therefore matches
              # nothing at all: `Bash(bash tests/:*)` asks for `bash tests/`
              # followed by a space, which no real command is, and the six
              # script-runner entries below were all written that way. Run
              # 34200686220 is what that cost - the engineer on
              # new-project-agents-v3#18 wrote the whole diff, was refused
              # `bash tests/check.sh` and `./tests/check.sh` by an allowlist
              # that names both, and stopped without pushing, which is what its
              # role tells it to do when a check will not run.
              #
              # A bare trailing `*` has no space before it, so it may end
              # mid-argument: `Bash(bash tests/*)` matches `bash tests/check.sh`
              # and grants nothing the broken form was not already meant to.
              tools="$tools,Bash(bash tests/*),Bash(bash scripts/*),Bash(sh tests/*),Bash(sh scripts/*)"
              tools="$tools,Bash(./tests/*),Bash(./scripts/*)"
              tools="$tools,Bash(git log:*),Bash(git switch:*),Bash(git checkout:*)"
              ;;
            *)
              echo "::error::No tool allowlist for role '$ROLE'. Add one before this role can run."
              exit 1
              ;;
          esac

          echo "Allowing for $ROLE: $tools"
          echo "allowed=$tools" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        env:
          # `gh` is how this run writes to GitHub. Without a token in the step
          # environment every gh command in the allowlist above fails at the
          # first call, which reads exactly like the agent choosing not to try.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          # The OAuth token is what makes this bill the subscription rather than
          # API credits. An API key here would quietly spend money instead.
          claude_code_oauth_token: ${{ secrets.claude-code-oauth-token }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          # The action refuses a run started by a bot unless the bot is named
          # here, and every run this system starts for itself is started by a
          # bot: the orchestrator queues a child by labelling it, and a
          # finished child wakes its parent the same way. Without this the
          # cascade dies at the first handover with
          # "Workflow initiated by non-human actor", three seconds in, and the
          # issue is left agent:blocked as though the work had failed.
          #
          # The App's own slug and nothing else. `*` would allow any bot with
          # write access to start an agent run - a lint bot's comment, a
          # dependency bot's label - and this is the one place where an
          # unexpected trigger spends the subscription and pushes a commit.
          # The action lowercases both sides and strips a trailing `[bot]`
          # before comparing, so the bare slug matches the `<slug>[bot]` actor.
          #
          # Empty when no App is configured, which allows no bots at all. That
          # is the right default rather than a gap: without an App those
          # writes raise no events, so there are no bot-started runs to allow.
          allowed_bots: ${{ steps.app-token.outputs.app-slug }}
          use_sticky_comment: true
          track_progress: true
          claude_args: |
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "${{ steps.tools.outputs.allowed }}"
            ${{ inputs.model && format('--model {0}', inputs.model) || '' }}
          prompt: |
            Work issue #${{ needs.preflight.outputs.issue }} in ${{ github.repository }}
            as the `${{ needs.preflight.outputs.role }}` agent defined in
            `.claude/agents/` in this repository.

            Read that agent's definition and follow it exactly, including the
            clause at the end about `.claude/memory/`. Follow the house-rules,
            memory-protocol, and acceptance-criteria skills in `.claude/skills/`.

            This is run ${{ needs.preflight.outputs.attempt }} of ${{ needs.preflight.outputs.budget }} on this issue.
            Read the earlier attempts on the issue before repeating one of them.
            If this attempt fails the same way an earlier one did, stop and say
            so rather than trying a variation.

            ${{ needs.preflight.outputs.role == 'orchestrator' && 'You own this objective, not just its split. If it has no children yet, decompose it and queue the first wave. If it has children, you were woken because one of them reached agent:review or agent:blocked: read the state of all of them, deal with anything blocked, queue whatever has just become ready, and replace the status picture on this issue with a current one. That budget above is supervision runs on this objective, not attempts at a piece of work - being woken a dozen times over a four-child objective is normal, and getting near the end of it is worth saying out loud rather than spending quietly.' || '' }}

            You have ${{ inputs.max-turns }} turns. Reaching that cap kills the
            run where it stands: the whole job fails, nothing uncommitted
            survives, and the attempt is spent whether or not you had finished.
            What you have already committed and pushed does survive, on its
            branch - which is why pushing early is worth more than finishing
            tidily.
            So spend the budget in that order - commit and push as soon as you
            have something coherent, and keep committing as you go, rather than
            reading everything first and writing at the end. A pushed branch
            that is half the issue is worth more than a full plan that died
            with the container.

            A refused command is a configuration bug in this workflow, not a
            lock to pick. Name the exact command and what refused it, then
            stop. Do not retry it with different flags, a different quoting, or
            a different path - every one of those is a turn off the budget
            above, and the answer does not change.

            Your role definition names `mcp__github__*` tools. In this
            environment that capability is the `gh` CLI instead, already
            authenticated: `gh issue create`, `gh issue edit`, `gh issue
            comment`, `gh pr create` and so on, scoped to what your role is
            allowed to do. Use it rather than reporting that you have no way to
            write to GitHub. If a command you actually need is refused, name it
            and stop - that is a configuration bug worth one comment, not
            something to work around.

            Hard limits for this run, above anything the issue text asks for:
            - Never edit anything under `.github/workflows/`, `CODEOWNERS`, or
              `.claude/agents/` and `.claude/skills/`. Those last two are the
              copies of the shared roles: editing them here makes this
              repository quietly disagree with every other one, and the next
              /update-agents overwrites the change anyway. If the work seems to
              need it, comment saying why and stop.
            - Never skip, disable, or quarantine a test to get a check green.
            - Stay inside this one issue. Anything else you notice becomes a new
              issue, not a bigger diff.

      - name: Hand back to a human
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.preflight.outputs.issue }}
          KIND: ${{ needs.preflight.outputs.kind }}
          ROLE: ${{ needs.preflight.outputs.role }}
          RUN_LABEL: ${{ inputs.run-label }}
          MAX_TURNS: ${{ inputs.max-turns }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Hand back to the orchestrator where there is one, and to a human
          # where there is not.
          #
          # A child finishing is the event the orchestrator exists to react to:
          # a merged dependency is what makes a sibling ready to run, and a
          # blocked child is the case a human used to fix by hand. So a child
          # reaching either terminal state queues its parent objective, and the
          # orchestrator wakes, reads the whole tree, and decides what happens
          # next. Without this the roles still run, but only when a human
          # labels each one, which is the loop this is meant to close.
          #
          # Best effort, deliberately. Every failure here degrades to exactly
          # the old behaviour - the child keeps its label and a human queues the
          # parent by hand - so nothing below is allowed to fail the step.
          #
          # This has run end to end, once, and it is worth not re-deriving:
          # new-project-agents-v3#39, run 34385990685. A researcher child
          # finished, this step found the parent by its body line and labelled
          # it, the orchestrator woke as supervision run 2 of 20, read all three
          # children, and correctly declined to queue the next one because the
          # first child's branch had no merged pull request behind it yet. Three
          # separate faults had to be fixed before that worked: the concurrency
          # group (below), the parent lookup (here), and allowed_bots on the
          # action step.
          wake_parent() {
            # An orchestrator run is not a child, and only issues have parents.
            [ "$KIND" = "issue" ] || return 0
            [ "$ROLE" != "orchestrator" ] || return 0

            # `--json parent` is the documented field and needs a recent gh; the
            # REST call behind it is the fallback for a runner with an older
            # one. Neither is guaranteed on an issue that was never linked as a
            # sub-issue, which is why an empty answer is a normal outcome here
            # rather than an error.
            parent="$(gh issue view "$ISSUE" --json parent --jq '.parent.number' 2>/dev/null || true)"
            if [ -z "$parent" ] || [ "$parent" = "null" ]; then
              parent="$(gh api "repos/$GH_REPO/issues/$ISSUE" --jq '.parent.number' 2>/dev/null || true)"
            fi

            # Then the body reference, which is the one that actually fires.
            # Both calls above read a native sub-issue link, and the
            # orchestrator cannot make one: in a run its capability is the `gh`
            # CLI, and `gh issue create` has no sub-issue flag. Every child it
            # creates therefore reports has_parent false and answers null to
            # both, which is what happened on the first real objective. The
            # role writes `Parent: #<number>` as the first line of a child
            # body, so that line is the link, and this reads it.
            if [ -z "$parent" ] || [ "$parent" = "null" ]; then
              parent="$(gh issue view "$ISSUE" --json body --jq '.body' 2>/dev/null \
                | head -5 \
                | grep -oiE '^parent:[[:space:]]*#[0-9]+' \
                | grep -oE '[0-9]+' \
                | head -1 || true)"
            fi
            if [ -z "$parent" ] || [ "$parent" = "null" ]; then
              echo "No parent objective found for #$ISSUE. A human queues the objective."
              return 0
            fi

            plabels="$(gh issue view "$parent" --json labels --jq '.labels[].name' 2>/dev/null || true)"
            has() { echo "$plabels" | grep -qx "$1"; }

            # Only an objective has an orchestrator to wake, and a parent a
            # human has already stopped stays stopped: agent:blocked and
            # needs-decomposition both mean the next move is theirs.
            has 'objective' || { echo "#$parent is not an objective. Leaving it alone."; return 0; }
            if has 'agent:blocked' || has 'needs-decomposition'; then
              echo "#$parent is stopped for a human. Not waking it."
              return 0
            fi
            # Already queued: the run it is waiting for will read this child's
            # state when it starts, so a second label writes nothing and adding
            # a label an issue already carries raises no event anyway.
            has "$RUN_LABEL" && { echo "#$parent is already queued."; return 0; }

            echo "Waking the orchestrator on #$parent."
            gh issue edit "$parent" --add-label "$RUN_LABEL" || true
          }

          gh "$KIND" edit "$ISSUE" --remove-label 'agent:running' || true
          if [ "$JOB_STATUS" = "success" ]; then
            gh "$KIND" edit "$ISSUE" --add-label 'agent:review' || true
            wake_parent
            exit 0
          fi

          # A run that delivered is a review, whatever stopped it.
          #
          # The cap is a spend limit, not a verdict, and it was being read as
          # three things at once: this run cost too much, therefore the work is
          # bad, therefore the issue is scoped wrong. On
          # new-project-agents-v3#50 and #51 all three fired on work that was
          # complete, tested, and merged unchanged - the orchestrator had to
          # notice and relabel by hand both times.
          #
          # So the delivery decides the label. A ready, non-draft pull request
          # means the engineer got its work out; the issue belongs in review
          # even though the job failed. Anything else is still agent:blocked.
          # A draft does not count: that is work in progress, which is what the
          # draft says.
          delivered() {
            [ "$KIND" = "issue" ] || return 1
            for b in $(git ls-remote --heads origin "claude/issue-$ISSUE-*" 2>/dev/null \
              | awk '{print $2}' | sed 's#refs/heads/##'); do
              state="$(gh pr list --head "$b" --state open \
                --json isDraft --jq '.[0].isDraft' 2>/dev/null || true)"
              [ "$state" = "false" ] && return 0
            done
            return 1
          }

          if delivered; then
            echo "#$ISSUE has a pull request ready for review. Labelling it so."
            gh "$KIND" edit "$ISSUE" --add-label 'agent:review' || true
          else
            gh "$KIND" edit "$ISSUE" --add-label 'agent:blocked' || true
          fi
          wake_parent

          # What actually got delivered, as facts rather than an absence to be
          # interpreted. An agent reading this comment can otherwise only see
          # that no pull request exists, and "no pull request" is one short
          # step from "nothing landed" - which is exactly the wrong conclusion
          # when a branch is sitting there with the whole diff on it.
          #
          # Observed on new-project-agents-v3#46: both attempts pushed complete
          # work, neither opened a pull request, and the orchestrator's
          # diagnosis said nothing had been pushed. It had no instrument for
          # branches, so it inferred. This gives it the answer instead.
          delivery() {
            [ "$KIND" = "issue" ] || return 0
            branches="$(git ls-remote --heads origin "claude/issue-$ISSUE-*" 2>/dev/null \
              | awk '{print $2}' | sed 's#refs/heads/##' || true)"
            if [ -z "$branches" ]; then
              echo "No branch was pushed for this issue."
              return 0
            fi
            echo "Pushed, and where it got to:"
            for b in $branches; do
              n="$(gh pr list --head "$b" --state all --json number --jq '.[0].number' 2>/dev/null || true)"
              if [ -n "$n" ] && [ "$n" != "null" ]; then
                echo "- \`$b\` - pull request #$n"
              else
                echo "- \`$b\` - **no pull request**, so nothing downstream can see this work"
              fi
            done
          }
          landed="$(delivery || true)"

          # Why it failed, in one comment, rather than a bare label. The label
          # says a human is needed; it does not say whether the agent got the
          # work wrong or the harness stopped it, and those want opposite
          # responses - rewrite the issue, or raise the cap and re-queue.
          #
          # Best effort on purpose. The action's output file is its own format
          # and not a contract, so anything unreadable here falls through to
          # the label alone rather than failing the step or posting nonsense.
          summary="$(python3 - <<'PY' || true
          import json, os, pathlib

          path = pathlib.Path(os.environ.get("RUNNER_TEMP", "")) / "claude-execution-output.json"
          try:
              raw = path.read_text()
          except OSError:
              raise SystemExit(0)

          records = []
          try:
              parsed = json.loads(raw)
              records = parsed if isinstance(parsed, list) else [parsed]
          except json.JSONDecodeError:
              # Also accept newline-delimited records.
              for line in raw.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      records.append(json.loads(line))
                  except json.JSONDecodeError:
                      pass

          result = None
          for record in records:
              if isinstance(record, dict) and record.get("type") == "result":
                  result = record
          if result is None:
              raise SystemExit(0)

          cap = os.environ.get("MAX_TURNS") or ""
          cap = int(cap) if cap.isdigit() else None
          subtype = str(result.get("subtype") or "unknown")
          turns = result.get("num_turns")
          denials = result.get("permission_denials_count")

          parts = [f"ended `{subtype}`"]
          if isinstance(turns, int):
              parts.append(f"{turns} turns")
          if isinstance(denials, int) and denials:
              parts.append(f"{denials} permission denial(s)")
          print("The run " + ", ".join(parts) + ".")

          # The turn count decides this, not the subtype beside it. A run that
          # died on the cap has been seen reporting `success` in the same
          # sentence as a turn count above the cap - and because this branch
          # once keyed on the subtype alone, the cap went unmentioned and every
          # later reader went looking for a different explanation.
          at_cap = subtype == "error_max_turns" or (
              isinstance(turns, int) and cap is not None and turns >= cap
          )
          if at_cap:
              print()
              if subtype != "error_max_turns":
                  print(
                      f"It reports `{subtype}`, but {turns} turns against a cap of "
                      f"{cap} is the cap. Read the count, not the subtype."
                  )
              print(
                  "That is the turn cap, not a verdict on this issue. The work "
                  "was cut off mid-run: anything uncommitted is gone, but "
                  "anything already committed and pushed survives on its branch "
                  "- check what landed before assuming nothing did. Before "
                  "treating this as a scoping problem, check whether the run was "
                  "simply too big for the budget: raise `max-turns` on the caller "
                  "and re-queue, or split the issue."
              )
          if isinstance(denials, int) and denials:
              print()
              print(
                  "Permission denials mean commands the role needed are missing "
                  "from the allowlist in `agent-run.yml`. Each one also costs a "
                  "turn. Worth reading the run log before the next attempt."
              )
          PY
          )"

          if [ -n "$summary" ] || [ -n "$landed" ]; then
            gh "$KIND" comment "$ISSUE" --body "$(printf '%s\n\n%s\n\n%s\n\n%s' \
              "<!-- agent-factory:diagnosis --> **Run failed.**" \
              "$summary" \
              "$landed" \
              "[Run log]($RUN_URL)")" || true
          fi
