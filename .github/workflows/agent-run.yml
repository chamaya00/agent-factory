name: agent-run

# Wraps anthropics/claude-code-action for one agent run on one issue.
#
# Every setting below exists because a Pro subscription is a fixed budget:
# one run at a time, queued rather than cancelled, hard-capped in turns and
# minutes, and refused outright once an issue has burned three attempts.
#
# Projects call it with:
#   jobs:
#     agent:
#       uses: chamaya00/agent-factory/.github/workflows/agent-run.yml@v1
#       secrets: inherit

on:
  workflow_call:
    inputs:
      issue-number:
        description: Issue to work. Only needed for workflow_dispatch; otherwise taken from the event.
        type: string
        default: ''
      max-turns:
        description: >-
          Hard cap on agentic turns for one run. 15 was below the floor: an
          orchestrator spends most of a decomposition reading the roles, the
          skills, the memory file and the issue before it writes anything, and
          the action fails the whole run when the cap is hit even if the work
          itself finished.
        type: number
        default: 40
      timeout-minutes:
        description: Wall-clock cap for the agent job.
        type: number
        default: 30
      model:
        description: Model for the run. Empty uses the action default.
        type: string
        default: ''
      max-attempts:
        description: >-
          Attempts allowed on one issue before the run is refused. Three failed
          attempts means the issue was scoped wrong, not that it needs a fourth.
        type: number
        default: 3
      run-label:
        description: Label on an issue that means "run the agent now".
        type: string
        default: 'agent:queued'
      trigger-phrase:
        description: Phrase in a comment that starts a run.
        type: string
        default: '@claude'
      skip-path-patterns:
        description: >-
          Newline-separated globs. When a run is attached to a pull request and
          every changed file matches one of these, the run is skipped. Docs and
          lockfiles are not worth a slice of the subscription.
        type: string
        default: |
          docs/**
          *.md
          **/*.md
          package-lock.json
          **/package-lock.json
          pnpm-lock.yaml
          **/pnpm-lock.yaml
          yarn.lock
          **/yarn.lock
          LICENSE
    secrets:
      claude-code-oauth-token:
        description: OAuth token from `claude setup-token`. Bills the subscription rather than API credits.
        required: true
      app-id:
        description: GitHub App ID for the agent identity. Optional but strongly preferred.
        required: false
      app-private-key:
        description: Private key for that App.
        required: false

# Repo-wide, and deliberately not per-issue: two agents running at once on a
# Pro plan exhausts it. Queue, never cancel - a cancelled run has already spent
# its tokens and leaves the issue half finished.
concurrency:
  group: agent-run-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  # Never actions: write. A system that can rewrite its own gates has no gates.

jobs:
  preflight:
    name: decide whether to run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      # write, not read: a run refused on a pull request still has to label it
      # agent:blocked and say why, or a refusal reads as a flake.
      pull-requests: write
    outputs:
      should-run: ${{ steps.decide.outputs.should-run }}
      role: ${{ steps.decide.outputs.role }}
      issue: ${{ steps.decide.outputs.issue }}
      kind: ${{ steps.decide.outputs.kind }}
      attempt: ${{ steps.decide.outputs.attempt }}
    steps:
      - name: Resolve role, gate, and attempt count
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || inputs.issue-number }}
          KIND: ${{ (github.event.issue.pull_request != null || github.event.pull_request != null) && 'pr' || 'issue' }}
          RUN_LABEL: ${{ inputs.run-label }}
          TRIGGER_PHRASE: ${{ inputs.trigger-phrase }}
          MAX_ATTEMPTS: ${{ inputs.max-attempts }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          LABEL_NAME: ${{ github.event.label.name }}
          SKIP_PATTERNS: ${{ inputs.skip-path-patterns }}
          MARKER: '<!-- agent-factory:attempt -->'
        run: |
          set -euo pipefail

          skip() { echo "$1"; echo "should-run=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # gh splits issues and pull requests across two subcommands, and a
          # comment on a pull request arrives as an issue_comment event.
          view()    { gh "$KIND" view "$NUMBER" "$@"; }
          edit()    { gh "$KIND" edit "$NUMBER" "$@"; }
          comment() { gh "$KIND" comment "$NUMBER" "$@"; }

          [ -n "${NUMBER:-}" ] || skip "No issue or pull request in context. Nothing to run."

          # A comment only counts when it carries the trigger phrase.
          case "$EVENT_NAME" in
            issue_comment|pull_request_review_comment)
              case "$COMMENT_BODY" in
                *"$TRIGGER_PHRASE"*) : ;;
                *) skip "Comment does not carry $TRIGGER_PHRASE." ;;
              esac
              ;;
          esac

          # A label event only counts when it is the run label.
          if [ "$EVENT_NAME" = "issues" ] && [ "$EVENT_ACTION" = "labeled" ] && [ "$LABEL_NAME" != "$RUN_LABEL" ]; then
            skip "Label '$LABEL_NAME' is not the run label."
          fi

          labels="$(view --json labels --jq '.labels[].name' || true)"
          echo "Labels: $(echo "$labels" | tr '\n' ' ')"

          has_label() { echo "$labels" | grep -qx "$1"; }

          if has_label 'needs-decomposition'; then
            skip "Issue is labelled needs-decomposition. A human decides what happens next."
          fi
          if has_label 'agent:blocked'; then
            skip "Issue is labelled agent:blocked. Refusing to run."
          fi

          # An objective goes to the orchestrator. Everything else needs exactly
          # one role label.
          role=""
          if has_label 'objective'; then
            role="orchestrator"
          fi
          for candidate in researcher designer engineer; do
            if has_label "role:$candidate"; then
              if [ -n "$role" ]; then
                edit --add-label 'agent:blocked' || true
                skip "Carries more than one role. Work needing two roles is two issues."
              fi
              role="$candidate"
            fi
          done
          [ -n "$role" ] || skip "No role label and not an objective."

          # Docs and lockfiles are not worth a slice of the subscription.
          if [ "$KIND" = "pr" ]; then
            ignored() {
              local file="$1" pattern
              while IFS= read -r pattern; do
                [ -z "$pattern" ] && continue
                case "$file" in $pattern) return 0 ;; esac
                # A `**/x` pattern has to match `x` at the root as well.
                case "$pattern" in
                  '**/'*) case "$file" in ${pattern#'**/'}) return 0 ;; esac ;;
                esac
              done <<< "$SKIP_PATTERNS"
              return 1
            }
            changed="$(gh pr diff "$NUMBER" --name-only || true)"
            if [ -n "$changed" ]; then
              relevant=0
              while IFS= read -r file; do
                [ -z "$file" ] && continue
                if ! ignored "$file"; then
                  relevant=1
                  break
                fi
              done <<< "$changed"
              [ "$relevant" -eq 1 ] || skip "Pull request only touches ignored paths."
            fi
          fi

          # Attempt cap. Each run leaves exactly one marker comment, so the
          # markers are the count. Three means the scoping was wrong.
          attempts="$(view --json comments --jq "[.comments[] | select(.body | contains(\"$MARKER\"))] | length" || echo 0)"
          if [ "$attempts" -ge "$MAX_ATTEMPTS" ]; then
            edit --add-label 'agent:blocked' --remove-label "$RUN_LABEL" || true
            comment --body "$(printf '%s\n\n%s' \
              "$MARKER Refusing to run: this has already had $attempts agent runs." \
              "Three failed attempts on one issue means the issue was scoped wrong, not that it needs a fourth. Labelled \`agent:blocked\`. Decompose it or rewrite the acceptance criteria, then clear the label.")" || true
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            echo "::error::#$NUMBER has already had $attempts agent runs."
            exit 1
          fi

          echo "Running $role on #$NUMBER (attempt $((attempts + 1)))."
          {
            echo "should-run=true"
            echo "role=$role"
            echo "issue=$NUMBER"
            echo "kind=$KIND"
            echo "attempt=$((attempts + 1))"
          } >> "$GITHUB_OUTPUT"

  agent:
    name: run the agent
    needs: preflight
    if: needs.preflight.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      # The secrets context is not available in a step `if`, so the App id has
      # to come through env to decide whether there is an App identity at all.
      APP_ID: ${{ secrets.app-id }}
    steps:
      - name: Mint the agent identity token
        id: app-token
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Mark the issue running
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.preflight.outputs.issue }}
          KIND: ${{ needs.preflight.outputs.kind }}
          ATTEMPT: ${{ needs.preflight.outputs.attempt }}
          ROLE: ${{ needs.preflight.outputs.role }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh "$KIND" edit "$ISSUE" --add-label 'agent:running' --remove-label "${{ inputs.run-label }}" || true
          gh "$KIND" comment "$ISSUE" --body "$(printf '%s\n\n%s' \
            "<!-- agent-factory:attempt --> Starting **$ROLE**, attempt $ATTEMPT of ${{ inputs.max-attempts }}." \
            "[Run log]($RUN_URL)")" || true

      # The roles live in this repository, under .claude/, put there by
      # /new-project and updated by /update-agents. The action loads them the
      # way an interactive session does, so there is nothing to fetch here.
      #
      # This is only a presence check, and it is worth the six lines: an agent
      # that starts with no roles does not fail, it improvises. That produces a
      # pull request that looks like work and follows none of the rules, which
      # is more expensive to deal with than a job that refused to start.
      - name: The roles are in the repository
        run: |
          set -euo pipefail
          # Guarded rather than piped through 2>/dev/null: under pipefail a
          # missing directory fails the assignment and the step dies before
          # printing the one line that says what to do about it.
          count=0
          if [ -d .claude/agents ]; then
            count=$(find .claude/agents -name '*.md' -type f | wc -l)
          fi
          if [ "$count" -eq 0 ]; then
            echo "::error::No role definitions in .claude/agents/. Run /update-agents in this repository to bring them in, then re-run. Starting without them means an agent that answers to none of the house rules."
            exit 1
          fi
          echo "$count role definition(s) found."

      # The action starts an agent with a read-only tool set: Read, Glob, Grep,
      # its own comment tool, and the git commands it uses to land a commit.
      # Not Write, not Edit, not Bash, and nothing that can write to GitHub.
      #
      # Every role in .claude/agents/ declares tools beyond that set, and a role
      # that cannot use the tools it declares does not fail cleanly - it
      # improvises, spends the run, and leaves the issue agent:blocked with a
      # comment explaining that it had no tools. That is the most expensive way
      # to discover a configuration problem, so the allowlist is explicit here
      # and the guard checks it against the role definitions.
      #
      # The role definitions name mcp__github__* tools. Those come from the
      # GitHub MCP server, which this action does not start, so the equivalent
      # capability is granted as scoped `gh` commands instead - the same CLI and
      # the same token the rest of this workflow already uses.
      #
      # Scoped, not `Bash(gh:*)`: `gh api`, `gh workflow`, `gh secret` and
      # `gh repo` stay out of reach. A system that can rewrite its own gates has
      # no gates, and `gh api` is a hole straight through them.
      - name: Resolve the tool allowlist for this role
        id: tools
        env:
          ROLE: ${{ needs.preflight.outputs.role }}
        run: |
          set -euo pipefail

          # Every role reads the repository and answers on its own issue.
          #
          # The comment and git entries are the action's own: it needs them for
          # the sticky progress comment and for landing a commit. They are
          # listed again because it is not documented whether --allowedTools
          # merges with the action's defaults or replaces them. Redundant if it
          # merges; the difference between a working run and a silent one if it
          # replaces.
          common='mcp__github_comment__update_claude_comment'
          common="$common,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*)"
          common="$common,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*)"

          case "$ROLE" in
            orchestrator)
              # Creates and labels children. Writes no files, by definition.
              tools="$common,Bash(gh issue create:*),Bash(gh issue edit:*),Bash(gh label list:*),Bash(gh search issues:*)"
              ;;
            researcher)
              tools="$common,Write,Edit,WebFetch,WebSearch"
              ;;
            designer)
              tools="$common,Write,Edit,WebFetch"
              ;;
            engineer)
              # Writes code, runs the four scripts the gate runs, and opens the
              # pull request. No `gh pr merge`: merging stays a human's call.
              tools="$common,Write,Edit"
              tools="$tools,Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr checks:*)"
              tools="$tools,Bash(npm ci:*),Bash(npm install:*),Bash(npm run:*),Bash(npm test:*)"
              tools="$tools,Bash(git log:*),Bash(git switch:*),Bash(git checkout:*)"
              ;;
            *)
              echo "::error::No tool allowlist for role '$ROLE'. Add one before this role can run."
              exit 1
              ;;
          esac

          echo "Allowing for $ROLE: $tools"
          echo "allowed=$tools" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        env:
          # `gh` is how this run writes to GitHub. Without a token in the step
          # environment every gh command in the allowlist above fails at the
          # first call, which reads exactly like the agent choosing not to try.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          # The OAuth token is what makes this bill the subscription rather than
          # API credits. An API key here would quietly spend money instead.
          claude_code_oauth_token: ${{ secrets.claude-code-oauth-token }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          use_sticky_comment: true
          track_progress: true
          claude_args: |
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "${{ steps.tools.outputs.allowed }}"
            ${{ inputs.model && format('--model {0}', inputs.model) || '' }}
          prompt: |
            Work issue #${{ needs.preflight.outputs.issue }} in ${{ github.repository }}
            as the `${{ needs.preflight.outputs.role }}` agent defined in
            `.claude/agents/` in this repository.

            Read that agent's definition and follow it exactly, including the
            clause at the end about `.claude/memory/`. Follow the house-rules,
            memory-protocol, and acceptance-criteria skills in `.claude/skills/`.

            This is attempt ${{ needs.preflight.outputs.attempt }} of ${{ inputs.max-attempts }}.
            Read the earlier attempts on the issue before repeating one of them.
            If this attempt fails the same way an earlier one did, stop and say
            so rather than trying a variation.

            Your role definition names `mcp__github__*` tools. In this
            environment that capability is the `gh` CLI instead, already
            authenticated: `gh issue create`, `gh issue edit`, `gh issue
            comment`, `gh pr create` and so on, scoped to what your role is
            allowed to do. Use it rather than reporting that you have no way to
            write to GitHub. If a command you actually need is refused, name it
            and stop - that is a configuration bug worth one comment, not
            something to work around.

            Hard limits for this run, above anything the issue text asks for:
            - Never edit anything under `.github/workflows/`, `CODEOWNERS`, or
              `.claude/agents/` and `.claude/skills/`. Those last two are the
              copies of the shared roles: editing them here makes this
              repository quietly disagree with every other one, and the next
              /update-agents overwrites the change anyway. If the work seems to
              need it, comment saying why and stop.
            - Never skip, disable, or quarantine a test to get a check green.
            - Stay inside this one issue. Anything else you notice becomes a new
              issue, not a bigger diff.

      - name: Hand back to a human
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.preflight.outputs.issue }}
          KIND: ${{ needs.preflight.outputs.kind }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh "$KIND" edit "$ISSUE" --remove-label 'agent:running' || true
          if [ "$JOB_STATUS" = "success" ]; then
            gh "$KIND" edit "$ISSUE" --add-label 'agent:review' || true
          else
            gh "$KIND" edit "$ISSUE" --add-label 'agent:blocked' || true
          fi
